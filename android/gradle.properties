##############################
# PERFORMANCE
##############################
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dkotlin.daemon.jvm.options=-Xmx2048m
org.gradle.daemon=true
org.gradle.parallel=true

##############################
# ANDROID
##############################
android.useAndroidX=true
android.enablePngCrunchInReleaseBuilds=true

##############################
# ARCHITECTURE (SAFE)
##############################
newArchEnabled=false

##############################
# ENGINE
##############################
hermesEnabled=true

##############################
# UI
##############################
edgeToEdgeEnabled=true

##############################
# MEDIA
##############################
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

##############################
# PACKAGING
##############################
expo.useLegacyPackaging=false

##############################
# DEV
##############################
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

##############################
# NETWORK / MAVEN / TLS FIXES
##############################
# Force Gradle to use TLS 1.2 and 1.3
systemProp.https.protocols=TLSv1.2,TLSv1.3

# Increase timeout for slow or unstable networks
org.gradle.internal.http.socketTimeout=60000
org.gradle.internal.http.connectionTimeout=60000

# Retry for network issues
org.gradle.internal.http.retryCount=5
